spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_verification
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 4
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: systempass

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        show_sql: true
        hbm2ddl:
          auto: update
        format_sql: true
        default_batch_fetch_size: 10

jwt:
  secret-key: "S6a8KbLCBk9F8o7ve+d93eTEReVU5JHmFO/7cPWO0X/UstRfCNlqYzudGyQluOPxZF+I+52XwiLmCNoWs7gPvA=="
  expiration: 3600 # JWT 토큰 만료 시간 (초 단위)